# herdr configuration — shared by Linux and Windows hosts.
#
# Keybindings are mapped to mirror the tmux setup in ~/.tmux.conf so the muscle
# memory carries over. Concept mapping between the two tools:
#   tmux window  -> herdr tab
#   tmux session -> herdr workspace
#   tmux pane    -> herdr pane
#
# Live-reload most settings after editing with:  herdr server reload-config
# (also bound below to prefix + r, matching tmux's reload binding).

onboarding = false

[terminal]
# Open new panes/tabs in the active pane's directory, matching the tmux splits
# that use -c "#{pane_current_path}".
new_cwd = "follow"
shell_mode = "auto"

[theme]
# Catppuccin Mocha, matching @catppuccin_flavor "mocha" in .tmux.conf.
name = "catppuccin"
auto_switch = false

[theme.custom]
# Reset panel surfaces so the tab bar inherits the terminal background.
panel_bg = "reset"

[ui]
mouse_capture = true    # tmux: set -g mouse on
pane_borders = true     # tmux: pane-border-lines heavy
pane_gaps = true
confirm_close = true
# Obsidian purple active-border accent, matching the tmux
# @catppuccin_pane_active_border_style "fg=#7c3aed". `accent` is a [ui] key.
accent = "#7c3aed"

[keys]
# herdr supports a single prefix key only (no tmux-style prefix2 / send-prefix).
# tmux binds two: ctrl+b (primary) and M-a (secondary). Using M-a here so alt+a
# acts as the prefix; ctrl+b is NOT a prefix in herdr.
prefix = "alt+a"

# --- Pane focus: vim h/j/k/l (tmux: bind h/j/k/l select-pane) ---
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# --- Pane swap: Shift + h/j/k/l (extra, mirrors the focus keys) ---
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# --- Splits (tmux: bind - split -v / bind \ split -h) ---
split_horizontal = "prefix+minus"      # tmux "-": stacked (horizontal divider)
split_vertical = "prefix+backslash"    # tmux "\": side-by-side (vertical divider)

# --- Pane lifecycle ---
zoom = "prefix+z"           # tmux default: zoom pane
close_pane = "prefix+x"     # tmux default: kill-pane
copy_mode = "prefix+["      # tmux default: copy mode
resize_mode = "prefix+shift+r"  # enter resize mode, then h/j/k/l or arrows

# --- Tabs (tmux windows) ---
new_tab = "prefix+c"            # tmux: bind c new-window
rename_tab = "prefix+comma"     # tmux default: rename-window
switch_tab = "prefix+1..9"      # tmux default: select-window by index
next_tab = ["alt+shift+l", "ctrl+l"]        # tmux: bind -n M-L next-window
previous_tab = ["alt+shift+h", "prefix+b", "ctrl+h"]  # tmux: M-H prev-window + bind b previous-window

# --- Workspaces (tmux sessions) ---
new_workspace = "prefix+shift+n"    # fallback: create workspace without prompt
workspace_picker = "prefix+shift+s"  # fallback: built-in workspace picker
rename_workspace = "prefix+shift+w"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

# --- Agents / sidebar / session ---
goto = ["prefix+g", "prefix+w"]   # jump to an agent/pane
detach = "prefix+d"               # tmux default: detach
toggle_sidebar = "prefix+tab"     # show/hide the agent sidebar
focus_agent = "prefix+alt+1..9"   # focus agent by index

# --- Custom command keybindings ---------------------------------------------

# Reload the config in place, matching tmux's "bind r source-file ~/.tmux.conf".
[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr server reload-config"
description = "reload herdr config"

# Prompt for a workspace name before creating it.
[[keys.command]]
key = "prefix+n"
type = "pane"
command = "/home/user/.config/herdr/new-workspace"
description = "new named workspace"

# Search workspaces with fzf and switch to the selected workspace.
[[keys.command]]
key = "prefix+s"
type = "pane"
command = "/home/user/.config/herdr/switch-workspace"
description = "search workspaces"

# File manager popup, matching tmux's "bind f display-popup ranger".
# (ranger is Linux/macOS only; the binding is inert on Windows.)
[[keys.command]]
key = "prefix+f"
type = "pane"
command = "ranger"
description = "file manager (ranger)"

# Throwaway shell in a scratch pane, matching tmux's "bind t display-popup bash".
[[keys.command]]
key = "prefix+t"
type = "pane"
command = "bash"
description = "scratch shell"

# Git UI in a throwaway pane (cross-platform).
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "git UI (lazygit)"
