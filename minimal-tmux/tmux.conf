# Minimal, plugin-free tmux config for servers.
# No TPM, no plugins, no external binaries, no background daemons.

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set -g mouse on
set -s escape-time 50
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
set -g allow-passthrough on

# Secondary prefix
set -g prefix2 M-a
bind M-a send-prefix

# vim-like pane switching
bind -r ^ last-window
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Pane resizing with alt arrow keys
unbind Up; unbind Down; unbind Left; unbind Right
bind -r Up resize-pane -U 10
bind -r Down resize-pane -D 10
bind -r Left resize-pane -L 10
bind -r Right resize-pane -R 10

# Window navigation
bind b previous-window
bind -n M-H previous-window
bind -n M-L next-window

# Splits keep current path
unbind '"'; unbind '%'
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane

# Status bar at top, mauve accent (hand-written, no plugins)
set -g status-position top
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=#7c3aed"
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#1e1e2e,bg=#7c3aed,bold] #S #[fg=#7c3aed,bg=default] "
set -g status-right "#[fg=#9399b2]#H #[fg=#1e1e2e,bg=#7c3aed,bold] %Y-%m-%d %H:%M "
set -g window-status-format "#[fg=#9399b2] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "
set -g status-interval 5
