unbind r
bind r source-file ~/.tmux.conf
set -g mouse on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
set -g allow-passthrough on

set -g prefix2 M-a
bind M-a send-prefix

# vim-like pane switching
bind -r ^ last-window
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Implement pane resizing with alt array keys
unbind Up
unbind Down
unbind Left
unbind Right
bind -r Up resize-pane -U 10
bind -r Down resize-pane -D 10
bind -r Left resize-pane -L 10
bind -r Right resize-pane -R 10

# Extra window navigation: prefix-b for previous; default prefix-n/p still work.
bind b previous-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Display Popup bindings
unbind n
bind n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
unbind s
bind s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
unbind t
bind t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "bash"

unbind f
bind f display-popup \
  -w 80% \
  -h 80% \
  -E 'ranger'

# Windows Splitting
unbind '"'
unbind '%'

bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Set the Status bar to the top
set -g status-position top

# Add blank second status line for padding between bar and terminal
set -g status-format[1] "#[bg=default] "

# Thicker pane borders using heavy line-drawing characters
set -g pane-border-lines heavy

# Override active pane border to use Obsidian purple
set -g @catppuccin_pane_active_border_style "fg=#7c3aed"

# Lower escape time without using tmux-sensible's aggressive 0ms default.
# https://superuser.com/a/252717/65504
set -s escape-time 50

# Plugin Manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_overlay_2},reverse]#[none]#[fg=#{@thm_crust},bg=#{@thm_overlay_2}]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_surface_0},reverse]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_mauve},reverse]#[none]#[fg=#{@thm_crust},bg=#{@thm_mauve}]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_surface_1},reverse]"

# Show window name in the status bar, prefixed with a coding-agent status glyph.
# The glyph comes from a read-only helper (.config/tmux/tmux-agent-status.sh):
#   ● agent busy    ○ agent idle    (terminal / no agent running)
# This only decorates the DISPLAYED text; it never renames the window, so it is
# safe alongside firstmate, which resolves its crew windows by exact window_name.
set -g @catppuccin_window_text " #(~/.config/tmux/tmux-agent-status.sh #{pane_id}) #W"
set -g @catppuccin_window_current_text " #(~/.config/tmux/tmux-agent-status.sh #{pane_id}) #W"

run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
